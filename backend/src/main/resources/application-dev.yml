# ================================================================
# TUKETBIR - DEVELOPMENT PROFILE (H2 In-Memory Database)
# ================================================================

spring:
  datasource:
    url: jdbc:h2:mem:tuketbir_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password: 
    driver-class-name: org.h2.Driver
    
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  flyway:
    enabled: false
    
  h2:
    console:
      enabled: true
      path: /h2-console

# JWT Configuration for dev
jwt:
  secret: dev_secret_key_for_testing_purposes_only_32chars
  expiration: 86400000

logging:
  level:
    tr.gov.tuketbir: DEBUG
    org.springframework.security: DEBUG
