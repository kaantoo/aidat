services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: tuketbir-postgres
    environment:
      POSTGRES_DB: tuketbir_db
      POSTGRES_USER: tuketbir
      POSTGRES_PASSWORD: tuketbir_secret_2024
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - tuketbir-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tuketbir -d tuketbir_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: tuketbir-redis
    command: redis-server --requirepass tuketbir_redis_2024
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - tuketbir-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "tuketbir_redis_2024", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: tuketbir-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: tuketbir_minio
      MINIO_ROOT_PASSWORD: tuketbir_minio_2024
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - tuketbir-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  # Backend Spring Boot Application
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tuketbir-backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tuketbir_db
      SPRING_DATASOURCE_USERNAME: tuketbir
      SPRING_DATASOURCE_PASSWORD: tuketbir_secret_2024
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: tuketbir_redis_2024
      JWT_SECRET: tuketbir_jwt_secret_key_very_long_and_secure_2024_production
      JWT_EXPIRATION: 3600000
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: tuketbir_minio
      MINIO_SECRET_KEY: tuketbir_minio_2024
      MINIO_BUCKET: tuketbir-documents
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tuketbir-network
    restart: unless-stopped

  # Frontend React Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tuketbir-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - tuketbir-network
    restart: unless-stopped

  # Nginx Reverse Proxy (Production)
  nginx:
    image: nginx:alpine
    container_name: tuketbir-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - tuketbir-network
    restart: unless-stopped

networks:
  tuketbir-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
